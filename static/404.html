<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CitasMédicas — Página no encontrada</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--azul:#1a56db;--azul-o:#1e3a8a;--azul-c:#dbeafe;--gris-t:#1f2937;--gris-m:#6b7280;--gris-f:#f8fafc}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gris-f);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .container{text-align:center;max-width:480px}
    .num{font-family:'Playfair Display',serif;font-size:8rem;font-weight:700;color:var(--azul-c);line-height:1;margin-bottom:1rem}
    .num span{color:var(--azul)}
    h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gris-t);margin-bottom:.75rem}
    p{color:var(--gris-m);font-size:.95rem;line-height:1.7;margin-bottom:2rem}
    .btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
    .btn{padding:.75rem 1.5rem;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s}
    .btn-p{background:var(--azul);color:white;box-shadow:0 4px 14px rgba(26,86,219,.35)}
    .btn-p:hover{background:var(--azul-o);transform:translateY(-1px)}
    .btn-s{background:white;color:var(--gris-t);border:1.5px solid #e5e7eb}
    .btn-s:hover{border-color:var(--azul);color:var(--azul)}
    .icon{font-size:4rem;margin-bottom:1.5rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏥</div>
    <div class="num"><span>4</span>0<span>4</span></div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida. No te preocupes, puedes volver al inicio.</p>
    <div class="btns">
      <a href="/" class="btn btn-p">🏠 Ir al inicio</a>
      <a href="/dashboard" class="btn btn-s">📅 Mi dashboard</a>
    </div>
  </div>
</body>
</html>
