<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CitasMédicas — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #0d6e5a; --verde-claro: #12896f;
      --verde-menta: #e6f4f1; --crema: #faf8f5;
      --texto: #1a2e28; --gris: #6b7b76;
      --borde: #d4e4e0; --blanco: #ffffff;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--crema); min-height: 100vh; }

    /* Navbar */
    .navbar {
      background: white;
      border-bottom: 1px solid var(--borde);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: .6rem; font-weight: 600; color: var(--texto); font-size: 1rem; }
    .nav-logo-icon { width: 36px; height: 36px; background: var(--verde); border-radius: 8px; display: grid; place-items: center; font-size: 1.1rem; }
    .nav-usuario { display: flex; align-items: center; gap: 1rem; }
    .nav-nombre { font-size: .88rem; color: var(--gris); }
    .nav-nombre strong { color: var(--texto); }
    .badge-rol { padding: .25rem .7rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
    .badge-medico { background: #dbeafe; color: #1d4ed8; }
    .badge-paciente { background: var(--verde-menta); color: var(--verde); }
    .btn-logout { padding: .45rem 1rem; border: 1.5px solid var(--borde); border-radius: 8px; background: white; font-family: 'DM Sans', sans-serif; font-size: .82rem; color: var(--gris); cursor: pointer; transition: all .2s; }
    .btn-logout:hover { border-color: #e74c3c; color: #e74c3c; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 64px); }

    /* Sidebar */
    .sidebar { background: white; border-right: 1px solid var(--borde); padding: 1.5rem 1rem; }
    .sidebar-section { margin-bottom: 2rem; }
    .sidebar-title { font-size: .72rem; font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .75rem; padding: 0 .5rem; }
    .nav-item { display: flex; align-items: center; gap: .75rem; padding: .65rem .75rem; border-radius: 8px; cursor: pointer; font-size: .88rem; color: var(--gris); transition: all .2s; margin-bottom: .2rem; text-decoration: none; }
    .nav-item:hover { background: var(--verde-menta); color: var(--verde); }
    .nav-item.activo { background: var(--verde-menta); color: var(--verde); font-weight: 600; }
    .nav-item span { font-size: 1.1rem; }

    /* Contenido */
    .contenido { padding: 2rem; }
    .bienvenida { margin-bottom: 2rem; }
    .bienvenida h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--texto); margin-bottom: .3rem; }
    .bienvenida p { color: var(--gris); font-size: .9rem; }

    /* Tarjetas de stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: white; border: 1px solid var(--borde); border-radius: 12px; padding: 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .stat-icon { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 1.4rem; flex-shrink: 0; }
    .stat-icon.verde { background: var(--verde-menta); }
    .stat-icon.azul { background: #dbeafe; }
    .stat-icon.naranja { background: #fef3c7; }
    .stat-icon.rojo { background: #fee2e2; }
    .stat-info { flex: 1; }
    .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--texto); line-height: 1; }
    .stat-label { font-size: .8rem; color: var(--gris); margin-top: .2rem; }

    /* Módulos */
    .modulos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .modulo-card { background: white; border: 1px solid var(--borde); border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: all .2s; text-decoration: none; display: block; }
    .modulo-card:hover { border-color: var(--verde); box-shadow: 0 4px 16px rgba(13,110,90,.1); transform: translateY(-2px); }
    .modulo-icon { font-size: 2rem; margin-bottom: .75rem; }
    .modulo-titulo { font-size: 1rem; font-weight: 600; color: var(--texto); margin-bottom: .4rem; }
    .modulo-desc { font-size: .83rem; color: var(--gris); line-height: 1.5; }
    .modulo-arrow { margin-top: 1rem; font-size: .82rem; color: var(--verde); font-weight: 500; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-logo">
    <div class="nav-logo-icon">🏥</div>
    CitasMédicas
  </div>
  <div class="nav-usuario">
    <div class="nav-nombre">Hola, <strong id="nav-nombre">...</strong></div>
    <span class="badge-rol" id="badge-rol"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Principal</div>
      <a class="nav-item activo" href="/dashboard"><span>🏠</span> Inicio</a>
      <a class="nav-item" href="#"><span>📅</span> Mis citas</a>
      <a class="nav-item" href="#"><span>👤</span> Mi perfil</a>
    </div>
    <div class="sidebar-section" id="sidebar-medico" style="display:none">
      <div class="sidebar-title">Médico</div>
      <a class="nav-item" href="#"><span>👥</span> Pacientes</a>
      <a class="nav-item" href="#"><span>📋</span> Historial</a>
      <a class="nav-item" href="#"><span>⏰</span> Horarios</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Cuenta</div>
      <a class="nav-item" href="#" onclick="cerrarSesion()"><span>🚪</span> Salir</a>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="contenido">
    <div class="bienvenida">
      <h1>Bienvenido, <span id="nombre-usuario">...</span> 👋</h1>
      <p id="subtitulo">Aquí tienes un resumen de tu actividad</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon verde">📅</div>
        <div class="stat-info">
          <div class="stat-num">0</div>
          <div class="stat-label">Citas pendientes</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon azul">✅</div>
        <div class="stat-info">
          <div class="stat-num">0</div>
          <div class="stat-label">Citas completadas</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon naranja">🔔</div>
        <div class="stat-info">
          <div class="stat-num">0</div>
          <div class="stat-label">Notificaciones</div>
        </div>
      </div>
      <div class="stat-card" id="stat-pacientes" style="display:none">
        <div class="stat-icon rojo">👥</div>
        <div class="stat-info">
          <div class="stat-num">0</div>
          <div class="stat-label">Pacientes</div>
        </div>
      </div>
    </div>

    <!-- Módulos -->
    <div class="modulos-grid" id="modulos-grid"></div>
  </main>

</div>

<script>
  // Verificar si está autenticado
  const token = localStorage.getItem('token');
  const usuarioStr = localStorage.getItem('usuario');

  if (!token || !usuarioStr) {
    window.location.href = '/';
  }

  const usuario = JSON.parse(usuarioStr);

  // Mostrar nombre y rol
  document.getElementById('nav-nombre').textContent = usuario.nombre;
  document.getElementById('nombre-usuario').textContent = usuario.nombre.split(' ')[0];

  const badge = document.getElementById('badge-rol');
  badge.textContent = usuario.rol === 'medico' ? '👨‍⚕️ Médico' : '🙋 Paciente';
  badge.className = `badge-rol ${usuario.rol === 'medico' ? 'badge-medico' : 'badge-paciente'}`;

  // Módulos según rol
  const modulos = {
    paciente: [
      { icon: '📅', titulo: 'Agendar cita', desc: 'Reserva una nueva cita con tu médico de confianza de forma rápida.', link: '#' },
      { icon: '📋', titulo: 'Mis citas', desc: 'Consulta, cancela o reagenda tus citas médicas programadas.', link: '#' },
      { icon: '👤', titulo: 'Mi perfil', desc: 'Actualiza tu información personal y datos de contacto.', link: '#' },
      { icon: '📄', titulo: 'Historial médico', desc: 'Revisa el historial de tus consultas y diagnósticos anteriores.', link: '#' },
    ],
    medico: [
      { icon: '📅', titulo: 'Agenda del día', desc: 'Revisa las citas programadas para hoy y los próximos días.', link: '#' },
      { icon: '👥', titulo: 'Mis pacientes', desc: 'Gestiona la lista de tus pacientes y su historial clínico.', link: '#' },
      { icon: '⏰', titulo: 'Gestionar horarios', desc: 'Configura tu disponibilidad y bloquea fechas no disponibles.', link: '#' },
      { icon: '📋', titulo: 'Consultas', desc: 'Registra diagnósticos, recetas y notas de cada consulta.', link: '#' },
    ],
  };

  // Mostrar sidebar médico
  if (usuario.rol === 'medico') {
    document.getElementById('sidebar-medico').style.display = 'block';
    document.getElementById('stat-pacientes').style.display = 'flex';
    document.getElementById('subtitulo').textContent = 'Aquí tienes un resumen de tu actividad médica';
  }

  // Renderizar módulos
  const grid = document.getElementById('modulos-grid');
  const lista = modulos[usuario.rol] || modulos.paciente;
  grid.innerHTML = lista.map(m => `
    <a class="modulo-card" href="${m.link}">
      <div class="modulo-icon">${m.icon}</div>
      <div class="modulo-titulo">${m.titulo}</div>
      <div class="modulo-desc">${m.desc}</div>
      <div class="modulo-arrow">Ir al módulo →</div>
    </a>
  `).join('');

  // Cerrar sesión
  function cerrarSesion() {
    localStorage.removeItem('token');
    localStorage.removeItem('usuario');
    window.location.href = '/';
  }
</script>
</body>
</html>
