<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CitasMédicas — Recuperar contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--azul:#1a56db;--azul-o:#1e3a8a;--azul-c:#dbeafe;--azul-mc:#eff6ff;--blanco:#fff;--gris-t:#1f2937;--gris-m:#6b7280;--gris-b:#e5e7eb;--gris-f:#f8fafc;--verde:#059669;--error:#dc2626;--error-c:#fef2f2}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gris-f);min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .panel-izq{background:var(--azul-o);display:flex;flex-direction:column;justify-content:center;padding:3rem;position:relative;overflow:hidden}
    .panel-izq::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.25) 0%,transparent 70%);top:-150px;right:-150px}
    .shape-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
    .logo{display:flex;align-items:center;gap:.75rem;z-index:1;position:relative;margin-bottom:3rem}
    .logo-mark{width:44px;height:44px;background:var(--azul);border-radius:12px;display:grid;place-items:center;font-size:.85rem;font-weight:700;color:white}
    .logo-name{font-size:1.1rem;font-weight:700;color:white}
    .hero{z-index:1;position:relative}
    .hero h1{font-family:'Playfair Display',serif;font-size:2.4rem;line-height:1.15;color:white;margin-bottom:1rem}
    .hero h1 em{font-style:italic;color:var(--azul-c)}
    .hero p{color:rgba(255,255,255,.65);font-size:.95rem;line-height:1.75;max-width:340px}
    .panel-der{display:flex;align-items:center;justify-content:center;padding:3rem 4rem;background:var(--blanco)}
    .form-box{width:100%;max-width:420px;animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .back-link{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--gris-m);text-decoration:none;margin-bottom:2rem;font-weight:500}
    .back-link:hover{color:var(--azul)}
    .form-eyebrow{font-size:.75rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
    .form-box h2{font-family:'Playfair Display',serif;font-size:1.9rem;color:var(--gris-t);margin-bottom:.3rem}
    .form-box p{color:var(--gris-m);font-size:.88rem;margin-bottom:1.5rem;line-height:1.6}
    .paso{display:none}.paso.visible{display:block}
    .campo{margin-bottom:1rem}
    .campo label{display:block;font-size:.82rem;font-weight:600;color:var(--gris-t);margin-bottom:.4rem}
    .input-wrap{position:relative}
    .input-wrap input{width:100%;padding:.78rem 1rem .78rem 2.8rem;border:1.5px solid var(--gris-b);border-radius:10px;background:var(--gris-f);font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;color:var(--gris-t);outline:none;transition:border-color .2s}
    .input-wrap input:focus{border-color:var(--azul);background:var(--blanco)}
    .input-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--gris-m);font-size:.95rem;pointer-events:none}
    .pregunta-box{background:var(--azul-mc);border:1.5px solid var(--azul-c);border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:.9rem;color:var(--azul-o);font-weight:600;display:none}
    .btn{width:100%;padding:.88rem;background:var(--azul);color:white;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(26,86,219,.35)}
    .btn:hover{background:var(--azul-o)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .alerta{padding:.8rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;display:none;border:1px solid transparent}
    .alerta.error{background:var(--error-c);color:var(--error);border-color:#fecaca}
    .alerta.exito{background:#f0fdf4;color:var(--verde);border-color:#bbf7d0}
    .strength-bar{height:3px;background:var(--gris-b);border-radius:3px;overflow:hidden;margin-top:.4rem}
    .strength-fill{height:100%;border-radius:3px;transition:width .3s,background .3s;width:0%}
    @media(max-width:768px){body{grid-template-columns:1fr}.panel-izq{display:none}.panel-der{padding:2rem 1.5rem}}
  </style>
</head>
<body>
<div class="panel-izq">
  <div class="shape-grid"></div>
  <div class="logo"><div class="logo-mark">CM</div><span class="logo-name">CitasMédicas</span></div>
  <div class="hero">
    <h1>Recupera tu <em>acceso</em> de forma segura</h1>
    <p>Responde tu pregunta de seguridad y crea una nueva contraseña. Es rápido y seguro.</p>
  </div>
</div>
<div class="panel-der">
  <div class="form-box">
    <a href="/" class="back-link">← Volver al login</a>
    <div class="form-eyebrow">Recuperar acceso</div>
    <h2>¿Olvidaste tu contraseña?</h2>
    <p id="desc-text">Ingresa tu correo para encontrar tu pregunta de seguridad.</p>
    <div id="alerta" class="alerta"></div>

    <!-- Paso 1: Email -->
    <div class="paso visible" id="paso1">
      <div class="campo">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="tu@correo.com"/>
        </div>
      </div>
      <button class="btn" onclick="buscarPregunta()">Continuar →</button>
    </div>

    <!-- Paso 2: Pregunta -->
    <div class="paso" id="paso2">
      <div class="pregunta-box" id="pregunta-box"></div>
      <div class="campo">
        <label>Tu respuesta</label>
        <div class="input-wrap">
          <span class="input-icon">🛡️</span>
          <input type="text" id="respuesta" placeholder="Escribe tu respuesta..."/>
        </div>
      </div>
      <button class="btn" onclick="verificarRespuesta()">Verificar →</button>
    </div>

    <!-- Paso 3: Nueva contraseña -->
    <div class="paso" id="paso3">
      <div class="campo">
        <label>Nueva contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="nueva-pass" placeholder="Mínimo 6 caracteres" oninput="checkStrength(this.value)"/>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="sf"></div></div>
        <span id="sl" style="font-size:.74rem;display:block;margin-top:.2rem"></span>
      </div>
      <div class="campo">
        <label>Confirmar nueva contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="conf-pass" placeholder="Repite la contraseña"/>
        </div>
      </div>
      <button class="btn" onclick="resetPassword()">Guardar nueva contraseña</button>
    </div>
  </div>
</div>

<script>
let emailGuardado = '';

function mostrarAlerta(msg, tipo) {
  const el = document.getElementById('alerta');
  el.textContent = msg; el.className = `alerta ${tipo}`; el.style.display = 'block';
}

async function buscarPregunta() {
  const email = document.getElementById('email').value.trim();
  if (!email) { mostrarAlerta('❌ Ingresa tu correo', 'error'); return; }
  document.getElementById('alerta').style.display = 'none';
  try {
    const res = await fetch(`/auth/pregunta-seguridad/${encodeURIComponent(email)}`);
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) throw new Error('Correo no encontrado');
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Correo no encontrado');
    emailGuardado = email;
    document.getElementById('pregunta-box').textContent = '🛡️ ' + data.pregunta;
    document.getElementById('pregunta-box').style.display = 'block';
    document.getElementById('paso1').classList.remove('visible');
    document.getElementById('paso2').classList.add('visible');
    document.getElementById('desc-text').textContent = 'Responde tu pregunta de seguridad.';
  } catch (err) { mostrarAlerta('❌ ' + err.message, 'error'); }
}

async function verificarRespuesta() {
  const respuesta = document.getElementById('respuesta').value.trim();
  if (!respuesta) { mostrarAlerta('❌ Escribe tu respuesta', 'error'); return; }
  document.getElementById('alerta').style.display = 'none';
  try {
    const res = await fetch('/auth/verificar-respuesta', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailGuardado, respuesta })
    });
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) throw new Error('Error del servidor');
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Respuesta incorrecta');
    document.getElementById('paso2').classList.remove('visible');
    document.getElementById('paso3').classList.add('visible');
    document.getElementById('desc-text').textContent = 'Crea tu nueva contraseña.';
  } catch (err) { mostrarAlerta('❌ ' + err.message, 'error'); }
}

async function resetPassword() {
  const nueva = document.getElementById('nueva-pass').value;
  const conf = document.getElementById('conf-pass').value;
  if (!nueva || nueva.length < 6) { mostrarAlerta('❌ Mínimo 6 caracteres', 'error'); return; }
  if (nueva !== conf) { mostrarAlerta('❌ Las contraseñas no coinciden', 'error'); return; }
  const respuesta = document.getElementById('respuesta').value.trim();
  document.getElementById('alerta').style.display = 'none';
  try {
    const res = await fetch('/auth/reset-con-pregunta', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailGuardado, respuesta, nueva_password: nueva })
    });
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) throw new Error('Error del servidor');
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Error al guardar contraseña');
    mostrarAlerta('✅ Contraseña actualizada. Redirigiendo...', 'exito');
    setTimeout(() => { window.location.href = '/'; }, 2000);
  } catch (err) { mostrarAlerta('❌ ' + err.message, 'error'); }
}

function checkStrength(val) {
  const fill = document.getElementById('sf'); const label = document.getElementById('sl');
  let s = 0;
  if (val.length >= 6) s++; if (val.length >= 10) s++;
  if (/[A-Z]/.test(val)) s++; if (/[0-9]/.test(val)) s++; if (/[^A-Za-z0-9]/.test(val)) s++;
  const n = [{p:'0%',c:'',l:''},{p:'25%',c:'#ef4444',l:'Muy débil'},{p:'50%',c:'#f97316',l:'Débil'},{p:'75%',c:'#eab308',l:'Buena'},{p:'90%',c:'#22c55e',l:'Fuerte'},{p:'100%',c:'#059669',l:'Muy fuerte'}][Math.min(s,5)];
  fill.style.width=n.p; fill.style.background=n.c; label.textContent=n.l; label.style.color=n.c;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('paso1').classList.contains('visible')) buscarPregunta();
  else if (document.getElementById('paso2').classList.contains('visible')) verificarRespuesta();
  else if (document.getElementById('paso3').classList.contains('visible')) resetPassword();
});
</script>
</body>
</html>
