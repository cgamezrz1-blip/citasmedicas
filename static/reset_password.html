<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CitasMédicas — Nueva contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--azul:#1a56db;--azul-o:#1e3a8a;--azul-c:#dbeafe;--azul-mc:#eff6ff;--blanco:#fff;--gris-t:#1f2937;--gris-m:#6b7280;--gris-b:#e5e7eb;--gris-f:#f8fafc;--verde:#059669;--error:#dc2626;--error-c:#fef2f2}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gris-f);min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .panel-izq{background:var(--azul-o);display:flex;flex-direction:column;justify-content:center;padding:3rem;position:relative;overflow:hidden}
    .panel-izq::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.25) 0%,transparent 70%);top:-150px;right:-150px}
    .shape-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
    .logo{display:flex;align-items:center;gap:.75rem;z-index:1;position:relative;margin-bottom:3rem}
    .logo-mark{width:44px;height:44px;background:var(--azul);border-radius:12px;display:grid;place-items:center;font-size:.85rem;font-weight:700;color:white}
    .logo-name{font-size:1.1rem;font-weight:700;color:white}
    .hero{z-index:1;position:relative}
    .hero h1{font-family:'Playfair Display',serif;font-size:2.6rem;line-height:1.15;color:white;margin-bottom:1rem}
    .hero h1 em{font-style:italic;color:var(--azul-c)}
    .hero p{color:rgba(255,255,255,.65);font-size:.95rem;line-height:1.75;max-width:340px}
    .panel-der{display:flex;align-items:center;justify-content:center;padding:3rem 4rem;background:var(--blanco)}
    .form-box{width:100%;max-width:400px;animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .form-eyebrow{font-size:.75rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
    .form-box h2{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gris-t);margin-bottom:.4rem}
    .form-box p{color:var(--gris-m);font-size:.9rem;margin-bottom:2rem;line-height:1.6}
    .campo{margin-bottom:1.1rem}
    .campo label{display:block;font-size:.82rem;font-weight:600;color:var(--gris-t);margin-bottom:.45rem}
    .input-wrap{position:relative}
    .input-wrap input{width:100%;padding:.82rem 2.8rem .82rem 2.85rem;border:1.5px solid var(--gris-b);border-radius:10px;background:var(--gris-f);font-family:'Plus Jakarta Sans',sans-serif;font-size:.92rem;color:var(--gris-t);outline:none;transition:border-color .2s,box-shadow .2s}
    .input-wrap input:focus{border-color:var(--azul);background:var(--blanco);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
    .input-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--gris-m);font-size:1rem;pointer-events:none}
    .toggle-pass{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gris-m);cursor:pointer;font-size:.9rem;padding:0}
    .strength-bar{height:4px;background:var(--gris-b);border-radius:4px;overflow:hidden;margin-top:.5rem}
    .strength-fill{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0%}
    .strength-label{font-size:.74rem;color:var(--gris-m);margin-top:.25rem}
    .btn{width:100%;padding:.9rem;background:var(--azul);color:white;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem;box-shadow:0 4px 14px rgba(26,86,219,.35);margin-top:.5rem}
    .btn:hover{background:var(--azul-o);transform:translateY(-1px)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .alerta{padding:.85rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;display:none;border:1px solid transparent;line-height:1.5}
    .alerta.error{background:var(--error-c);color:var(--error);border-color:#fecaca}
    .alerta.exito{background:#f0fdf4;color:var(--verde);border-color:#bbf7d0}
    @media(max-width:768px){body{grid-template-columns:1fr}.panel-izq{display:none}.panel-der{padding:2rem 1.5rem}}
  </style>
</head>
<body>
<div class="panel-izq">
  <div class="shape-grid"></div>
  <div class="logo"><div class="logo-mark">CM</div><span class="logo-name">CitasMédicas</span></div>
  <div class="hero">
    <h1>Crea una <em>nueva</em> contraseña segura</h1>
    <p>Elige una contraseña fuerte que no hayas usado antes. Te recomendamos usar letras, números y símbolos.</p>
  </div>
</div>
<div class="panel-der">
  <div class="form-box">
    <div class="form-eyebrow">Nueva contraseña</div>
    <h2>Restablecer contraseña</h2>
    <p>Ingresa y confirma tu nueva contraseña.</p>
    <div id="alerta" class="alerta"></div>
    <div class="campo">
      <label>Nueva contraseña</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" oninput="checkStrength(this.value)"/>
        <button class="toggle-pass" onclick="togglePass('password','tb1')" type="button" id="tb1">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="sf"></div></div>
      <div class="strength-label" id="sl"></div>
    </div>
    <div class="campo">
      <label>Confirmar contraseña</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="confirmar" placeholder="Repite tu contraseña"/>
        <button class="toggle-pass" onclick="togglePass('confirmar','tb2')" type="button" id="tb2">👁</button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="resetear()">
      <span id="btn-text">Guardar nueva contraseña</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) { document.getElementById('alerta').textContent = '❌ Token inválido o expirado'; document.getElementById('alerta').className = 'alerta error'; document.getElementById('alerta').style.display = 'block'; document.getElementById('btn').disabled = true; }
function togglePass(id, btnId) { const input = document.getElementById(id); const btn = document.getElementById(btnId); input.type = input.type === 'password' ? 'text' : 'password'; btn.textContent = input.type === 'password' ? '👁' : '🙈'; }
function checkStrength(val) {
  const fill = document.getElementById('sf'); const label = document.getElementById('sl');
  let score = 0;
  if (val.length >= 6) score++; if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++; if (/[0-9]/.test(val)) score++; if (/[^A-Za-z0-9]/.test(val)) score++;
  const n = [{pct:'0%',color:'',label:''},{pct:'25%',color:'#ef4444',label:'Muy débil'},{pct:'50%',color:'#f97316',label:'Débil'},{pct:'75%',color:'#eab308',label:'Buena'},{pct:'90%',color:'#22c55e',label:'Fuerte'},{pct:'100%',color:'#059669',label:'Muy fuerte'}][Math.min(score,5)];
  fill.style.width = n.pct; fill.style.background = n.color; label.textContent = n.label; label.style.color = n.color;
}
function mostrarAlerta(msg, tipo) { const el = document.getElementById('alerta'); el.textContent = msg; el.className = `alerta ${tipo}`; el.style.display = 'block'; }
async function resetear() {
  const password = document.getElementById('password').value;
  const confirmar = document.getElementById('confirmar').value;
  const btn = document.getElementById('btn'); const spinner = document.getElementById('spinner'); const btnText = document.getElementById('btn-text');
  document.getElementById('alerta').style.display = 'none';
  if (!password || password.length < 6) { mostrarAlerta('❌ La contraseña debe tener al menos 6 caracteres', 'error'); return; }
  if (password !== confirmar) { mostrarAlerta('❌ Las contraseñas no coinciden', 'error'); return; }
  btn.disabled = true; spinner.style.display = 'block'; btnText.textContent = 'Guardando...';
  try {
    const res = await fetch('/auth/reset-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, nueva_password: password }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    mostrarAlerta('✅ ' + data.mensaje, 'exito');
    setTimeout(() => { window.location.href = '/'; }, 2000);
  } catch (err) {
    mostrarAlerta('❌ ' + err.message, 'error');
  } finally { btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Guardar nueva contraseña'; }
}
</script>
</body>
</html>
